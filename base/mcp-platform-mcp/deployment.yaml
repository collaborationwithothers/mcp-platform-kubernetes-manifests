apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: mcp-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: mcp-server
      containers:
        - name: mcp-server
          image: >-
            acrmcpaksplatform.azurecr.io/mcp-tools-aspnetcore:f1fdac173e6b8a584ca4b812787eadfae84df0f7
          command: ["/bin/sh", "-c"]
          args:
            - |
              : "${AZURE_TENANT_ID:?AZURE_TENANT_ID is required.}"
              : "${AZURE_AUTHORITY_HOST:?AZURE_AUTHORITY_HOST is required.}"
              export Authentication__Authority=\
              "${AZURE_AUTHORITY_HOST}${AZURE_TENANT_ID}/v2.0"
              export MicrosoftEntra__TenantId="${AZURE_TENANT_ID}"
              exec dotnet McpTools.AspNetCore.dll
          env:
            - name: Authentication__Audience
              value: "api://89ef34f7-7c4f-40f6-8c31-49ff2b3d7cdc"
            - name: MicrosoftEntra__ServerAppClientId
              value: "89ef34f7-7c4f-40f6-8c31-49ff2b3d7cdc"
            - name: DownstreamOrdersApi__BaseUrl
              value: "https://mcp-tracer-downstream-func.azurewebsites.net"
            - name: DownstreamOrdersApi__Scope
              value: "api://5693176e-0afd-4461-9cbf-b5d47bb9264a/user_impersonation"
            - name: DownstreamOrdersApi__ApplicationScope
              value: "api://5693176e-0afd-4461-9cbf-b5d47bb9264a/.default"
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: mcp-server-telemetry
                  key: application-insights-connection-string
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault

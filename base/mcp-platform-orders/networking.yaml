apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: mcp-platform
spec:
  type: ClusterIP
  selector:
    app: orders-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The existing private MCP Gateway terminates TLS for this host. This separate
# route lets the VNet verifier reach the Orders application directly without
# changing the MCP /mcp route or the placeholder Gateway.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: mcp-platform-orders
  namespace: mcp-platform
spec:
  hosts:
    - mcp.internal.consultwithcloud.com
  gateways:
    - mcp-platform-mcp
  http:
    - match:
        - uri:
            prefix: /api/orders
      route:
        - destination:
            host: orders-api
            port:
              number: 80

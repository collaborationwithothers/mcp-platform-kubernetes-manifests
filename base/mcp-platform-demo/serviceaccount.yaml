# ServiceAccount for the placeholder workload's Azure workload identity.
# Workload identity federation lets a pod get an Entra token without a
# stored secret: AKS's OIDC issuer, a federated identity credential on a
# user-assigned managed identity, and this ServiceAccount annotation
# together let the pod exchange its Kubernetes token for an Azure AD token.
#
# The name must stay "mcp-platform-placeholder": it is the Terraform
# default for placeholder_service_account_name in
# mcp-platform-azure/infra/terraform/scenarios/s1-aks-platform, and the
# federated credential subject
# (system:serviceaccount:mcp-platform-demo:mcp-platform-placeholder) is
# built from this name plus the namespace in namespace.yaml.
#
# client-id: REPLACE_ME_CLIENT_ID is a placeholder. The real value is the
# "placeholder_workload_client_id" Terraform output in mcp-platform-azure
# (infra/terraform/scenarios/s1-aks-platform/outputs.tf) -- the client id of
# a user-assigned managed identity that exists only after a live
# `terraform apply`. It cannot be committed here because Terraform has not
# run yet when this file is written, and even after it runs the value would
# still need copying by hand or by a workflow step -- there is no
# credential to embed, so this is not a secret, but it must never look like
# a real value. See README.md, "Placeholder values a human must fill in",
# for how to substitute it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-platform-placeholder
  namespace: mcp-platform-demo
  annotations:
    azure.workload.identity/client-id: "REPLACE_ME_CLIENT_ID"

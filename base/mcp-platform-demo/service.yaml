# ClusterIP Service in front of the placeholder Deployment. Cluster-internal
# only: the VirtualService in virtualservice.yaml is what the Istio ingress
# gateway routes to, this Service is just the stable target it routes
# through.
apiVersion: v1
kind: Service
metadata:
  name: mcp-platform-placeholder
  namespace: mcp-platform-demo
spec:
  selector:
    app: mcp-platform-placeholder
  ports:
    - name: http
      port: 80
      targetPort: http

name: Prepare MCP deployment PR

on:
  pull_request:
    branches:
      - main
  repository_dispatch:
    types:
      - mcp-server-gitops-promotion-requested

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-static-contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Verify GitOps contracts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-mcp-deployment-pr.sh
          bash scripts/validate-mcp-private-route.sh

  prepare-deployment-pr:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: mcp-server-deployment-pr
      cancel-in-progress: false
    env:
      IMAGE_REFERENCE: ${{ github.event.client_payload.image_reference }}
      WORKLOAD_IDENTITY_CLIENT_ID: >-
        ${{ github.event.client_payload.workload_identity_client_id }}
      MANAGED_ISTIO_REVISION: >-
        ${{ github.event.client_payload.managed_istio_revision }}
      SERVER_APPLICATION_CLIENT_ID: >-
        ${{ github.event.client_payload.server_application_client_id }}
      RESOURCE_AUDIENCE: ${{ github.event.client_payload.resource_audience }}
      DOWNSTREAM_BASE_URL: >-
        ${{ github.event.client_payload.downstream_base_url }}
      DOWNSTREAM_SCOPE: ${{ github.event.client_payload.downstream_scope }}
      DOWNSTREAM_APPLICATION_SCOPE: >-
        ${{ github.event.client_payload.downstream_application_scope }}
      SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
      DEPLOYMENT_ISSUE: ${{ github.event.client_payload.deployment_issue }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate deployment PR inputs
        run: ./scripts/prepare-mcp-deployment-files.sh validate-inputs

      - name: Update the GitOps source
        id: update
        shell: bash
        run: |
          set -euo pipefail
          branch="codex/issue-154-mcp-workload-${SOURCE_COMMIT}"
          if git ls-remote --exit-code --heads origin \
            "refs/heads/${branch}" >/dev/null; then
            git fetch origin "${branch}"
            git switch --track "origin/${branch}"
          else
            git switch -c "${branch}"
          fi

          ./scripts/prepare-mcp-deployment-files.sh apply
          git diff --check

          if git diff --quiet; then
            echo "branch=${branch}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            argocd/apps/mcp-platform-mcp.yaml \
            base/mcp-platform-mcp/deployment.yaml \
            base/mcp-platform-mcp/namespace.yaml \
            base/mcp-platform-mcp/serviceaccount.yaml
          git commit -m "Deploy MCP workload ${SOURCE_COMMIT}"
          git push --set-upstream origin "${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Open or report the deployment PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.update.outputs.branch }}
        run: |
          set -euo pipefail
          existing_pr="$(gh pr list --state open --head "${BRANCH}" \
            --json url --jq '.[0].url')"
          if [ -n "${existing_pr}" ]; then
            echo "Deployment PR: ${existing_pr}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          size="$(git diff --numstat origin/main...HEAD | awk '
            { files++; additions += $1; deletions += $2 }
            END { printf "%d files; %d additions; " \
              "%d deletions; %d changed lines", files, additions, deletions,
              additions + deletions }')"
          body=$'## The concept\n\n'
          body+=$'Before this PR, Argo CD tracks the prior immutable MCP image.\n\n'
          body+=$'After this PR, Argo CD tracks the requested immutable MCP image '
          body+=$'and the dispatched runtime, identity, and Istio settings.\n\n'
          body+=$'Refs collaborationwithothers/mcp-platform-azure#154.\n\n'
          body+=$'## Reading order: core files first\n\nCore:\n\n'
          body+=$'- `base/mcp-platform-mcp/deployment.yaml` - runtime.\n'
          body+=$'- `base/mcp-platform-mcp/namespace.yaml` - Istio revision.\n'
          body+=$'- `base/mcp-platform-mcp/serviceaccount.yaml` - workload identity.\n\n'
          body+=$'Supporting:\n\n'
          body+=$'- `argocd/apps/mcp-platform-mcp.yaml` - Application.\n'
          body+=$'- `README.md` - records deployment.\n\n'
          body+=$'## PR size\n\n'
          body+=$'Independently verified behavior: generated MCP '
          body+=$'deployment configuration.\n\n'
          body+=$'Verification evidence: contract test and render.\n\n'
          body+="Measured size: ${size}"
          body+=$'\n\n'
          body+=$'Approved exception justification: N/A\n\n'
          body+=$'Approved exception link: N/A\n\n## Merge class\n\n'
          body+=$'- [ ] auto-merge-ok\n- [x] Requires review\n'
          body+=$'- [x] needs-live-test\n\n## Review summary\n\n'
          body+=$'Confirm the source commit and that no route, certificate, '
          body+=$'tenant ID, or placeholder change is included.\n\n'
          body+=$'AKS injection: https://learn.microsoft.com/azure/aks/'
          body+=$'workload-identity-overview#service-account-labels-and-'
          body+=$'annotations\n'
          body+=$'Istio revision: https://learn.microsoft.com/azure/aks/'
          body+=$'istio-deploy-addon#enable-sidecar-injection\n\n'
          body+=$'## Checklist\n\n'
          body+=$'- [ ] Review pass run on Opus 4.8\n'
          body+=$'- [x] Azure claims verified through Microsoft Learn\n'
          body+=$'- [x] Docs land in this PR\n- [x] COMPATIBILITY.md: N/A\n'
          body+=$'- [x] No secrets or tenant/subscription IDs\n'
          body+=$'- [x] No terraform apply/destroy\n'
          body+=$'- [x] No unmeasured figures\n'
          body+=$'- [x] Read-only branch preflight: N/A\n'
          body+=$'- [ ] Live-test run link:\n'
          pr_url="$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --draft \
            --label agent:codex \
            --label needs-live-test \
            --title "Deploy MCP workload ${SOURCE_COMMIT}" \
            --body "${body}")"
          echo "Deployment PR: ${pr_url}" >> "$GITHUB_STEP_SUMMARY"
